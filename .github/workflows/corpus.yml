name: Corpus regressions
on:
  push:
  pull_request:
jobs:
  corpus:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stealth
          POSTGRES_PASSWORD: stealth
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CORPUS_TEST_DSN: host=127.0.0.1 port=5432 user=stealth password=stealth dbname=postgres
      STEALTH_ADMIN_DSN: host=127.0.0.1 port=5432 user=stealth password=stealth dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install psycopg2-binary 'pglast>=8.0'
      - name: Template semantics and boundary counterexamples
        run: python tests/test_corpus_semantics.py
      - name: NEDB fixture materialisation regressions
        run: python tests/test_nedb_materialise.py
      - name: Forge rejects poisoned query pairs
        run: python tests/test_forge.py
